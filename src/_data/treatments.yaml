  excerpt:
    pl: Jak zachować młody i zdrowy wygląd skóry na lata? Przez cały rok eksploatujemy naszą skórę poddając ją działaniu różnych warunków atmosferycznych. Szczególnie brzemienna w skutkach jest ekspozycja na słońce. Intensywne opalanie pozostawia z reguły ślady na twarzy czy dekolcie, które czasem trudno nawet zamaskować delikatnym makijażem. Podobne przebarwienia pojawiają się wraz z upływem czasu także na grzbietach dłoni. Jak sobie z nimi radzić? Fotoodmładzanie laserowe pozwala na wyrównanie kolorytu skóry i usunięcie nieestetycznych przebarwień, a także widoczne odmłodzenie skóry.
    en: How can you maintain a youthful and healthy skin appearance for years? Throughout the year, we expose our skin to various weather conditions. Sun exposure is particularly damaging. Intensive tanning usually leaves marks on the face and decolletage that can sometimes be difficult to conceal even with light makeup. Similar discolorations also appear over time on the backs of the hands. How to deal with them? Laser photorejuvenation helps even out skin tone, remove unsightly discolorations, and visibly rejuvenate the skin.
