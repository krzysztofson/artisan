pl:
  - name: Kinga
    text: Bardzo dobry i doświadczony lekarz. Pewna ręka. Ma też świetny zespół ludzi. Polecam, jeśli nie chcesz martwić się o wynik operacji. Dla mnie najlepszy.
  - name: Joanna
    text: Miałam u Pana Doktora zabieg korekcji uszu. Uszy po zabiegu są piekne! Rekonwalescencja przebiega bez problemów, sam zabieg był szybki i bezproblemowy. Polecam
  - name: Małgorzata
    text: Olbrzymia wiedza, doświadczenie, kompetencje - niczego więcej pacjent nie potrzebuje. Szczerze polecam zawierzyć i oddać się w ręce Pana Doktora i jego Zespołu Specjalistów.
  - name: Xxx
    text: Pan doktor bardzo kontaktowy i konkretny. Widać zaangażowanie i chęć pomocy. Recepcja też przyjazna obsługa
en:
  - name: Kinga
    text: A very good and experienced doctor. A steady hand. He also has a great team. I recommend him if you don't want to worry about the outcome of the surgery. The best for me.
  - name: Joanna
    text: I had an ear correction procedure with the Doctor. The ears after the procedure are beautiful! The recovery is going smoothly, the procedure itself was quick and problem-free. I recommend.
  - name: Małgorzata
    text: Vast knowledge, experience, competence — a patient needs nothing more. I sincerely recommend trusting yourself to the Doctor and his Team of Specialists.
  - name: Xxx
    text: The doctor is very approachable and to the point. You can see commitment and a willingness to help. The reception staff are also friendly.
pl_heading: Opinie pozabiegowe naszych Pacjentek
en_heading: Post-procedure reviews from our patients
