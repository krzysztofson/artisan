- id: Witwicki
  name: dr n. med. Tadeusz St. Witwicki
  photo: imgs/zespol/dr-Witwicki.jpg
  specialty:
    pl: Chirurgia plastyczna, rekonstrukcyjna i&nbsp;estetyczna
    en: Plastic, reconstructive and aesthetic surgery
  role:
    pl: Specjalista chirurgii plastycznej, rekonstrukcyjnej i estetycznej.
    en: Specialist in plastic, reconstructive, and aesthetic surgery.
  bio:
    pl: |-
      <p>Doświadczenie zdobywał m.in.&nbsp;pod&nbsp;auspicjami rodziców —&nbsp;doc.&nbsp;Zofii Witwickiej
                    —&nbsp;wybitnej chirurg plastyk oraz&nbsp;laryngolog, a&nbsp;także prof.&nbsp;ortopedii Tadeusza
                    Witwickiego.</p>
      <p>Kształcił się na&nbsp;warszawskiej Akademii Medycznej oraz&nbsp;odbywał szkolenia w&nbsp;Pekinie, Glasgow,
                    Los Angeles&nbsp;<br>i&nbsp;Gandawie.&nbsp;Specjalizację z&nbsp;chirurgii plastycznej zdobył
                    w&nbsp;Klinice Chirurgii Plastycznej Centrum Medycznego Kształcenia Podyplomowego w&nbsp;Warszawie.
                    Kierownikiem specjalizacji był twórca polskiej chirurgii plastycznej prof.&nbsp;Michał Krauss. Regularnie
                    bierze udział w&nbsp;europejskich zjazdach z&nbsp;zakresu swojej specjalności (m.in.&nbsp;w&nbsp;Paryżu,
                    w&nbsp;Rzymie, w&nbsp;Mediolanie, w&nbsp;Sztokholmie, w&nbsp;Oslo). Od&nbsp;przeszło 20 lat prowadzi
                    własną praktykę lekarską.</p>
      <p>Członek założyciel Polskiego Towarzystwa Medycyny Estetycznej i&nbsp;Anti – Aging Członek zwyczajny
                    Polskiego Towarzystwa Chirurgii Plastycznej, Rekonstrukcyjnej i&nbsp;Estetycznej oraz&nbsp;Członek
                    Komitetu Organizacyjnego I&nbsp;zjazdu PTCHPRiE, Członek Polskiego Towarzystwa Chirurgii Onkologicznej.</p>
      <p>Międzynarodowy Trener Technik Rewitalizująco-Liftingujących APTOS, szkoleniowiec metody SlimLipo
                    w&nbsp;Polsce, prowadzi szkolenia dla lekarzy z&nbsp;zakresu rekonstrukcji piersi.</p>
      <p>Autor licznych publikacji z&nbsp;zakresu chirurgii plastycznej i&nbsp;rekonstrukcyjnej.</p>
    en: |-
      <p>He gained experience under the guidance of his parents — doc. Zofia Witwicka, an outstanding plastic
                    surgeon and laryngologist, and prof. Tadeusz Witwicki, an orthopedic specialist.</p>
      <p>He studied at the Warsaw Medical Academy and completed training in Beijing, Glasgow, Los
                    Angeles,<br>and Ghent. He obtained his specialization in plastic surgery at the Department of Plastic
                    Surgery of the Medical Center for Postgraduate Education in Warsaw. His specialization supervisor was the
                    founder of Polish plastic surgery, prof. Michal Krauss. He regularly participates in European conferences
                    in his field of specialization (including Paris, Rome, Milan, Stockholm, and Oslo). He has been running
                    his own medical practice for over 20 years.</p>
      <p>Founding member of the Polish Society of Aesthetic Medicine and Anti-Aging. Regular member of the Polish
                    Society of Plastic, Reconstructive, and Aesthetic Surgery, and member of the Organizing Committee of the
                    1st PTCHPRiE Congress. Member of the Polish Society of Oncological Surgery.</p>
      <p>International Trainer of APTOS Revitalizing and Lifting Techniques, SlimLipo method trainer in Poland,
                    and conducts training for physicians in the field of breast reconstruction.</p>
      <p>Author of numerous publications in the field of plastic and reconstructive surgery.</p>
- id: Mazurek
  name: dr n. med. Maciej Mazurek
  photo: imgs/zespol/Dr-Maciej-Mazurek.jpg
  specialty:
    pl: Chirurgia plastyczna
    en: Plastic surgery
  role:
    pl: Specjalista chirurgii plastycznej
    en: Specialist in plastic surgery
  bio:
    pl: |-
      <p>Specjalizuje się w&nbsp;operacjach chirurgii plastycznej twarzy i&nbsp;piersi,
                    w&nbsp;szczególności w&nbsp;zaawansowanym liftingu twarzy metodą Deep Plane. Ukończył I&nbsp;Wydział Lekarski Warszawskiego
                    Uniwersytetu Medycznego w&nbsp;2014 roku z&nbsp;wynikiem bardzo dobrym. Szkolenie specjalizacyjne
                    z&nbsp;zakresu chirurgii plastycznej odbywał w&nbsp;Zachodniopomorskim Centrum Leczenia Ciężkich Oparzeń
                    i&nbsp;Chirurgii Plastycznej oraz&nbsp;w&nbsp;Oddziale Klinicznym Chirurgii Plastycznej CMKP
                    w&nbsp;Warszawie i&nbsp;zakończył je&nbsp;zdając egzamin specjalizacyjny z&nbsp;oceną bardzo dobrą.&nbsp;</p>
      <p>W&nbsp;ramach poszerzania swoich umiejętności odbył staż szkoleniowy w&nbsp;jednym z&nbsp;największych
                    centrów chirurgii plastycznej w&nbsp;Wielkiej Brytanii – St Andrews Centre for Plastic Surgery and Burns.</p>
      <p>W&nbsp;2020 roku obronił pracę doktorską z&nbsp;zakresu chirurgii plastycznej i&nbsp;onkologicznej piersi.
                    Praca ta&nbsp;szczególnie wpisuje się w&nbsp;praktykę kliniczną Doktora Mazurka i&nbsp;obejmuje swoją
                    tematyką wykorzystanie nowoczesnych technologii w&nbsp;chirurgii plastycznej piersi, twarzy
                    i&nbsp;brzucha.</p>
      <p>Prywatnie pasjonat aktywnego wypoczynku, zdrowego trybu życia oraz&nbsp;sportów wodnych.</p>
    en: |-
      <p>He specializes in plastic surgery of the face and breasts, particularly in advanced Deep Plane facelift
                    procedures. He graduated from the 1st Faculty of Medicine at the Medical University of Warsaw in 2014
                    with honors. He completed his specialization training in plastic surgery at the West Pomeranian Center
                    for Severe Burns Treatment and Plastic Surgery and at the Clinical Department of Plastic Surgery of the
                    Medical Center for Postgraduate Education in Warsaw, passing the specialization exam with distinction.</p>
      <p>To expand his skills, he completed a training fellowship at one of the largest plastic surgery centers in
                    the United Kingdom — St Andrews Centre for Plastic Surgery and Burns.</p>
      <p>In 2020, he defended his doctoral thesis in the field of plastic and oncological breast surgery. This
                    work is particularly relevant to Dr. Mazurek's clinical practice and covers the use of modern
                    technologies in plastic surgery of the breast, face, and abdomen.</p>
      <p>In his private life, he is passionate about active recreation, a healthy lifestyle, and water sports.</p>
- id: Pietruski
  name: dr hab. n. med. Piotr Pietruski
  photo: imgs/zespol/Pietruski_2-1-600x832.jpg
  specialty:
    pl: Chirurgia plastyczna i&nbsp;rekonstrukcyjna
    en: Plastic and reconstructive surgery
  role:
    pl: Specjalista chirurgii plastycznej i rekonstrukcyjnej
    en: Specialist in plastic and reconstructive surgery
  bio:
    pl: |-
      <p>Dr&nbsp;hab. n. med. Piotr Pietruski jest specjalistą chirurgii plastycznej. Ukończył studia medyczne
                    na&nbsp;II&nbsp;Wydziale Lekarskim Warszawskiego Uniwersytetu Medycznego w&nbsp;2011. Dyplom lekarza
                    nostryfikował w&nbsp;USA zdając egzamin USMLE. W&nbsp;2019 uzyskał specjalizację z&nbsp;chirurgii
                    plastycznej zdając państwowy egzamin specjalizacyjny z&nbsp;wyróżnieniem. W&nbsp;roku 2018 podczas
                    odbywania rezydentury z&nbsp;chirurgii plastycznej otrzymał stopień doktora nauk medycznych, a&nbsp;tytuł
                    doktora habilitowanego nadano mu&nbsp;w&nbsp;2020&nbsp;r. W&nbsp;2023 roku, po&nbsp;ukończeniu 2-letniego
                    programu specjalizacyjnego prowadzonego przez&nbsp;Autonomiczny Uniwersytet Barcelony jako pierwszy Polski
                    chirurg plastyczny uzyskał europejski tytuł specjalisty w&nbsp;zakresie chirurgii onkologicznej,
                    rekonstrukcyjnej i&nbsp;estetycznej piersi (Master’s Degree in&nbsp;Surgical Oncology, Reconstructive and
                    Aesthetic Breast Surgery – MRBS (2020). Odbył on&nbsp;wiele staży klinicznych w&nbsp;zakresie estetycznej
                    i&nbsp;rekonstrukcyjnej chirurgii plastycznej m.in.&nbsp;w&nbsp;Sztokholmie, Zurichu, Gendawie,
                    Barcelonie, Londynie oraz&nbsp;w&nbsp;Australii i&nbsp;USA. Nie&nbsp;tylko&nbsp;stara się podążać
                    za&nbsp;trendami nowoczesnej chirurgii plastycznej, ale&nbsp;również je&nbsp;wyznaczać. Jest autorem
                    licznych publikacji naukowych o&nbsp;tematyce chirurgii plastycznej w&nbsp;najbardziej prestiżowych
                    światowych czasopismach o&nbsp;tej&nbsp;tematyce. W&nbsp;2020 roku Amerykańskie Towarzystwo Chirurgów
                    Plastycznych (ASPS) wraz z&nbsp;najbardziej uznanym czasopismem Plastic and Reconstructive Surgery
                    uhonorowało jego pracę najlepszą publikacją roku 2020 o&nbsp;tematyce chirurgii estetycznej piersi.
                    W&nbsp;2022 roku podczas VII Światowego Kongresu Rynoplastyki w&nbsp;Bergamo za&nbsp;swoją koncepcję
                    analizy nosa otrzymał nagrodę im.&nbsp;Luca Ortelli’ego. Poszukując perfekcji w&nbsp;chirurgii plastycznej
                    współpracuje naukowo z&nbsp;ośrodkami medycznymi w&nbsp;Szwecji, Australii czy&nbsp;USA. W&nbsp;latach
                    2019-2021 jako adiunkt prowadził wykłady z&nbsp;zakresu chirurgii plastycznej dla szkolących się lekarzy.
                    Obecnie jest gościnnym wykładowcą chirurgii plastycznej na&nbsp;Warszawskim Uniwersytecie Medycznym.
                    Współpracuje z&nbsp;Oddziałem Chirurgii Plastycznej Centrum Onkologii Ziemi Lubelskiej w&nbsp;Lublinie,
                    gdzie wykonuje złożone operacje rekonstrukcyjne piersi i&nbsp;twarzy.<br>Docent Pietruski specjalizuje
                    się w&nbsp;operacjach plastycznych piersi, brzucha oraz&nbsp;twarzy. Przykłada szczególną wagę
                    do&nbsp;przedoperacyjnej edukacji pacjenta oraz&nbsp;dokłada wszelkich starań aby zapewnić jak najlepsze
                    rezultaty leczenia.</p>
      <p>Jest członkiem Polskiego Towarzystwa Chirurgii Plastycznej, Estetycznej, Rekonstrukcyjnej
                    i&nbsp;Estetycznej (PTCHPRiE) oraz&nbsp;International Society of Aesthetic and Plastic
                    Surgery&nbsp;(ISAPS).</p>
    en: |-
      <p>Dr. hab. n. med. Piotr Pietruski is a specialist in plastic surgery. He graduated from the 2nd Faculty
                    of Medicine at the Medical University of Warsaw in 2011. He validated his medical degree in the USA by
                    passing the USMLE exam. In 2019, he obtained his specialization in plastic surgery by passing the
                    national specialization exam with distinction. In 2018, during his residency in plastic surgery, he
                    received his PhD in medical sciences, and was awarded his habilitation degree in 2020. In 2023, after
                    completing a 2-year specialization program at the Autonomous University of Barcelona, he became the first
                    Polish plastic surgeon to obtain the European specialist title in oncological, reconstructive, and
                    aesthetic breast surgery (Master’s Degree in Surgical Oncology, Reconstructive and Aesthetic Breast
                    Surgery — MRBS, 2020). He has completed numerous clinical fellowships in aesthetic and reconstructive
                    plastic surgery in Stockholm, Zurich, Ghent, Barcelona, London, as well as in Australia and the USA. He
                    not only strives to follow the trends of modern plastic surgery but also to set them. He is the author of
                    numerous scientific publications on plastic surgery in the most prestigious international journals. In
                    2020, the American Society of Plastic Surgeons (ASPS), together with the most renowned journal Plastic
                    and Reconstructive Surgery, honored his work as the best publication of 2020 on aesthetic breast surgery.
                    In 2022, at the 7th World Rhinoplasty Congress in Bergamo, he received the Luca Ortelli Award for his
                    concept of nasal analysis. In pursuit of perfection in plastic surgery, he collaborates scientifically
                    with medical centers in Sweden, Australia, and the USA. From 2019 to 2021, as an assistant professor, he
                    lectured on plastic surgery for physicians in training. He is currently a guest lecturer in plastic
                    surgery at the Medical University of Warsaw. He collaborates with the Department of Plastic Surgery at
                    the Lublin Region Oncology Center, where he performs complex reconstructive surgeries of the breast and
                    face.<br>Dr. Pietruski specializes in plastic surgery of the breast, abdomen, and face. He places
                    particular emphasis on preoperative patient education and makes every effort to ensure the best possible
                    treatment outcomes.</p>
      <p>He is a member of the Polish Society of Plastic, Reconstructive, and Aesthetic Surgery (PTCHPRiE) and
                    the International Society of Aesthetic and Plastic Surgery (ISAPS).</p>
- id: Mazur
  name: dr n. med. Sławomir Mazur
  photo: imgs/zespol/Slawomir-Mazur.jpg
  specialty:
    pl: Chirurgia onkologiczna
    en: Surgical oncology
  role:
    pl: Specjalista chirurgii onkologicznej
    en: Specialist in oncological surgery
  bio:
    pl: |-
      <p>Dr&nbsp;n. med. Sławomir Mazur Wydział Lekarski Warszawskiej Akademii Medycznej ukończył
                    w&nbsp;1984&nbsp;r. W&nbsp;tym samym roku podjął pracę w&nbsp;Instytucie Onkologii w&nbsp;Warszawie przy
                    ul.Wawelskiej 15. Pod&nbsp;okiem swojego mentora, prof.&nbsp;Andrzeja Kułakowskiego, zdobywał kolejne
                    kwalifikacje chirurgiczne w&nbsp;tym specjalizację z&nbsp;chirurgii onkologicznej.</p>
      <p>W&nbsp;1999&nbsp;r. obronił pracę doktorską z&nbsp;tematu&nbsp;“<em>Ocena współzależności pomiędzy stanem receptorów estrogenów, progesteronu i&nbsp;nabłonkowego czynnika
                      wzrostu, a&nbsp;klinicznym przebiegiem raka sutka”</em></p>
      <p>Obecnie pracuje w&nbsp;Klinice Nowotworów Piersi i&nbsp;Chirurgii Rekonstrukcyjnej Centrum Onkologii.-
                    Instytutu im.&nbsp;Marii Skłodowskiej-Curie w&nbsp;Warszawie, gdzie głównie zajmuje się operacjami
                    rekonstrukcyjnymi piersi.</p>
      <p>Jako pierwszy wprowadził do&nbsp;kliniki w&nbsp;celach terapeutycznych autologiczne tłuszczowe komórki
                    macierzyste w&nbsp;celu regeneracji tkanek i&nbsp;rekonstrukcji piersi.</p>
      <p>Jest autorem i&nbsp;współautorem dziesiątek prac naukowych w&nbsp;tym&nbsp; ostatniego podręcznika
                    Chirurgii Onkologicznej, rozdziału dotyczącego rekonstrucji piersi.</p>
      <p>Od&nbsp;25 lat współpracuje i&nbsp;jest&nbsp; lekarzem warszawskich Amazonek. Bezpośrednio związany jest
                    z&nbsp;Klubem Amazonek Warszawa Centrum.</p>
    en: |-
      <p>Dr. n. med. Slawomir Mazur graduated from the Faculty of Medicine at the Warsaw Medical Academy in 1984.
                    That same year, he began working at the Institute of Oncology in Warsaw at ul. Wawelska 15. Under the
                    guidance of his mentor, prof. Andrzej Kulakowski, he acquired successive surgical qualifications,
                    including a specialization in oncological surgery.</p>
      <p>In 1999, he defended his doctoral thesis on the topic of “<em>Assessment of the interdependence between
                      estrogen receptor, progesterone receptor, and epidermal growth factor receptor status and the clinical
                      course of breast cancer</em>.”</p>
      <p>He currently works at the Department of Breast Cancer and Reconstructive Surgery at the Maria
                    Sklodowska-Curie National Research Institute of Oncology in Warsaw, where he primarily performs breast
                    reconstruction surgeries.</p>
      <p>He was the first to introduce autologous adipose-derived stem cells for therapeutic purposes in tissue
                    regeneration and breast reconstruction at the clinic.</p>
      <p>He is the author and co-author of dozens of scientific papers, including the chapter on breast
                    reconstruction in the latest Oncological Surgery textbook.</p>
      <p>For over 25 years, he has been collaborating with and serving as a physician for the Warsaw Amazons
                    (breast cancer survivors' organization). He is directly affiliated with the Amazons Club Warsaw Center.</p>
- id: Jonczyk
  name: dr n. med. Justyna Jończyk
  photo: imgs/zespol/Justyna-Jonczyk.jpg
  specialty:
    pl: Chirurgia plastyczna
    en: Plastic surgery
  role:
    pl: Specjalista chirurgii plastycznej
    en: Specialist in plastic surgery
  bio:
    pl: |-
      <p>Jestem absolwentką Uniwersytetu Medycznego im.&nbsp;Piastów Śląskich we&nbsp;Wrocławiu, gdzie zdobyłam
                    solidne podstawy teoretyczne i&nbsp;praktyczne w&nbsp;zakresie medycyny. Część studiów realizowałam
                    w&nbsp;ramach międzynarodowej wymiany na&nbsp;Uniwersytecie Barcelońskim w&nbsp;Hiszpanii,
                    co&nbsp;pozwoliło mi&nbsp;na&nbsp;zdobycie cennego doświadczenia w&nbsp;międzynarodowym środowisku.
                    Lekarski Egzamin Państwowy zdałam z&nbsp;jednym z&nbsp;najwyższych wyników w&nbsp;kraju.</p>
      <p>Specjalizację z&nbsp;chirurgii plastycznej ukończyłam w&nbsp;Klinice Chirurgii Plastycznej
                    Uniwersyteckiego Centrum Klinicznego w&nbsp;Gdańsku, gdzie przez&nbsp;wiele lat rozwijałam swoje
                    umiejętności pod&nbsp;okiem wybitnych specjalistów. Jestem członkiem Polskiego Towarzystwa Chirurgii
                    Plastycznej, Rekonstrukcyjnej i&nbsp;Estetycznej, co&nbsp;świadczy o&nbsp;moim zaangażowaniu w&nbsp;rozwój
                    zawodowy i&nbsp;nieustanne podnoszenie kwalifikacji.</p>
      <p>Moje&nbsp;zawodowe zainteresowania koncentrują się na&nbsp;chirurgii piersi i&nbsp;twarzy,
                    ze&nbsp;szczególnym uwzględnieniem chirurgii nosa, powiek oraz&nbsp;liftingu twarzy i&nbsp;szyi.
                    Umiejętności w&nbsp;tych dziedzinach doskonaliłam pod&nbsp;okiem najlepszych europejskich specjalistów
                    z&nbsp;Włoch, Holandii i&nbsp;Francji. Stale podnoszę swoje kwalifikacje zawodowe, uczestnicząc
                    w&nbsp;licznych kursach i&nbsp;szkoleniach, aby zapewnić moim pacjentom najwyższy standard opieki
                    medycznej.</p>
      <p>W&nbsp;mojej&nbsp;pracy stawiam na&nbsp;bezpieczeństwo i&nbsp;komfort pacjenta, starając się podchodzić
                    do&nbsp;każdego przypadku z&nbsp;empatią i&nbsp;pełnym zaangażowaniem. Moje&nbsp;podejście do&nbsp;pracy
                    jest kompleksowe, co&nbsp;wynika z&nbsp;fascynacji medycyną długowieczności (longevity)
                    oraz&nbsp;zrozumienia procesów starzenia się komórek.</p>
      <p>Prywatnie jestem pasjonatką sportów ekstremalnych i&nbsp;wypieków. Mój&nbsp;perfekcjonizm, choć bywa
                    wyzwaniem dla najbliższych, przekłada się na&nbsp;osiąganie znakomitych wyników operacyjnych.</p>
    en: |-
      <p>I am a graduate of the Wroclaw Medical University, where I gained a solid theoretical and practical
                    foundation in medicine. I completed part of my studies through an international exchange program at the
                    University of Barcelona in Spain, which allowed me to gain valuable experience in an international
                    environment. I passed the National Medical Examination with one of the highest scores in the country.</p>
      <p>I completed my specialization in plastic surgery at the Department of Plastic Surgery of the University
                    Clinical Center in Gdansk, where I developed my skills for many years under the guidance of outstanding
                    specialists. I am a member of the Polish Society of Plastic, Reconstructive, and Aesthetic Surgery, which
                    reflects my commitment to professional development and continuous improvement of qualifications.</p>
      <p>My professional interests focus on breast and facial surgery, with particular emphasis on nosee surgery,
                    eyelid surgery, and face and neck lifting. I refined my skills in these areas under the guidance of the
                    best European specialists from Italy, the Netherlands, and France. I continuously improve my professional
                    qualifications by participating in numerous courses and training programs to provide my patients with the
                    highest standard of medical care.</p>
      <p>In my work, I prioritize patient safety and comfort, striving to approach each case with empathy and full
                    commitment. My approach to work is comprehensive, stemming from a fascination with longevity medicine and
                    an understanding of cellular aging processes.</p>
      <p>In my private life, I am passionate about extreme sports and baking. My perfectionism, while sometimes
                    challenging for those closest to me, translates into achieving excellent surgical outcomes.</p>
- id: Winiarska
  name: dr Natalia Winiarska
  photo: imgs/zespol/Natalia-Winiarska.jpg
  specialty:
    pl: Medycyna estetyczna
    en: Aesthetic medicine
  role:
    pl: Specjalista medycyny estetycznej
    en: Specialist in aesthetic medicine
  bio:
    pl: |-
      <p>Absolwentka Wydziału Lekarskiego Warszawskiego Uniwersytetu Medycznego. Dyplomowany Lekarz Medycyny
                    Estetycznej. Autorka publikacji naukowych z zakresu medycyny estetycznej, chirurgii plastycznej i
                    okulistyki. Nieustannie poszerza swoją wiedzę uczestnicząc w szkoleniach oraz konferencjach naukowych.
                    Wykonuje zabiegi regeneracyjne, które skupiają się na poprawie jakości skóry, przywróceniu jej zdrowego
                    wyglądu i blasku. Stawia na subtelne, naturalne rezultaty, które podkreślają indywidualne piękno pacjenta.
                    Specjalizuje się w&nbsp;chirurgicznej korekcji powiek (blefaroplastyce).</p>
    en: |-
      <p>Graduate of the Faculty of Medicine at the Medical University of Warsaw. Certified Aesthetic Medicine
                    Physician. Author of scientific publications in the fields of aesthetic medicine, plastic surgery, and
                    ophthalmology. She continuously expands her knowledge by participating in training programs and scientific
                    conferences. She performs regenerative treatments focused on improving skin quality, restoring its healthy
                    appearance and radiance. She emphasizes subtle, natural results that highlight each patient's individual
                    beauty. She specializes in surgical eyelid correction (blepharoplasty).</p>
- id: Korab
  name: lek. Beata Mitręga-Korab
  photo: imgs/zespol/Mitrega-Korab.jpg
  specialty:
    pl: Chirurgia ogólna, onkologiczna, otolaryngologia
    en: General and oncological surgery, otolaryngology
  role:
    pl: Specjalista chirurgii ogólnej, onkologicznej i otolaryngologii
    en: Specialist in general surgery, oncological surgery, and otolaryngology
  bio:
    pl: |-
      <p>Ukończyła Akademię Medyczną w&nbsp;Warszawie na&nbsp;Wydziale Lekarskim. W&nbsp;1986&nbsp;r. ukończyła
                    specjalizację z&nbsp;chirurgii ogólnej I&nbsp;st., chirurgii onkologicznej i&nbsp;otolaryngologii
                    I&nbsp;st.</p>
      <p>od&nbsp;1997 roku związana była z&nbsp;Centrum Onkologii Kliniki Nowotworów Głowy i&nbsp;Szyi Oddziału
                    Chirurgii Rekonstrukcyjnej i&nbsp;Plastycznej. Na&nbsp;przestrzeni czasu pracowała również w&nbsp;Klinice
                    Chirurgii Ogólnej i&nbsp;Chorób Klatki Piersiowej Centralnego Szpitala Klinicznego w&nbsp;Warszawie przy
                    ul.&nbsp;Banacha, Klinice Otolaryngologii CSK w&nbsp;Warszawie przy ul.&nbsp;Banacha
                    oraz&nbsp;w&nbsp;Szpitalu Dziecięcym w&nbsp;Warszawie przy ul.&nbsp;Niekłańskiej, gdzie zdobywała
                    doświadczenie i&nbsp;poszerzała swoją wiedzę. Aktualnie jest pracownikiem Kliniki Nowotworów Tkanek
                    Miękkich, Kości i&nbsp;Czerniaka.</p>
      <p>Dr&nbsp;Beata Mitręga-Korab zajmuje się diagnozowaniem i&nbsp;leczeniem zmian skórnych, nowotworów,
                    w&nbsp;tym raków i&nbsp;czerniaków skóry – zwłaszcza tych zlokalizowanych w&nbsp;obrębie głowy
                    i&nbsp;szyi. Specjalizuje się w&nbsp;wykonywaniu przeszczepów skóry oraz&nbsp;rekonstrukcji ubytków
                    przesuniętymi płatami skóry. Zdobyte doświadczenie i&nbsp;wiedzę wykorzystuje również w&nbsp;operowaniu
                    ślinianek, guzów tkanek miękkich i&nbsp;węzłów chłonnych.</p>
    en: |-
      <p>She graduated from the Warsaw Medical Academy, Faculty of Medicine. In 1986, she completed her
                    specialization in general surgery (1st degree), oncological surgery, and otolaryngology (1st degree).</p>
      <p>Since 1997, she has been affiliated with the Oncology Center, Head and Neck Cancer Clinic, Department of
                    Reconstructive and Plastic Surgery. Over the years, she also worked at the Department of General Surgery
                    and Thoracic Diseases at the Central Clinical Hospital in Warsaw on Banacha Street, the Department of
                    Otolaryngology at the Central Clinical Hospital in Warsaw on Banacha Street, and the Children's Hospital
                    in Warsaw on Nieklanska Street, where she gained experience and expanded her knowledge. She currently
                    works at the Department of Soft Tissue, Bone, and Melanoma Cancers.</p>
      <p>Dr. Beata Mitrega-Korab specializes in diagnoseing and treating skin lesions and tumors, including skin
                    cancers and melanomas — especially those located in the head and neck area. She specializes in performing
                    skin grafts and reconstructing defects using advanced skin flap techniques. She also applies her
                    experience and knowledge in surgery of salivary glands, soft tissue tumors, and lymph nodes.</p>
- id: Grous
  name: dr n. med. Aleksander Grous
  photo: imgs/zespol/Grous.jpg
  specialty:
    pl: Chirurgia ogólna i&nbsp;onkologiczna
    en: General and oncological surgery
  role:
    pl: Specjalista chirurgii ogólnej i onkologicznej
    en: Specialist in general and oncological surgery
  bio:
    pl: |-
      <p>Absolwent Akademii Medycznej w&nbsp;Warszawie 1998, doktor nauk medycznych, specjalista chirurgii ogólnej
                    oraz&nbsp;chirurgii onkologicznej. Wieloletni pracownik naukowy Akademii Medycznej w&nbsp;Warszawie
                    (obecnie Warszawski Uniwersytet Medyczny), a&nbsp;także Centrum Medycznego Kształcenia Podyplomowego
                    i&nbsp;zastępca ordynatora Kliniki Chirurgii Onkologicznej w&nbsp;Europejskim Centrum Zdrowia. Wykładowca
                    akademicki. Obecnie specjalista w&nbsp;Klinice Nowotworów Piersi i&nbsp;Chirurgii Rekonstrukcyjnej Centrum
                    Onkologii-Instytut w&nbsp;Warszawie.<br><br>Stypendysta Towarzystwa Chirurgów Polskich w&nbsp;Klinice
                    Chirurgii Uniwersytetu Medycznego w&nbsp;Leuven w&nbsp;Belgii.<br><br>Członek Polskiego Towarzystwa
                    Chirurgii Onkologicznej.</p>
    en: |-
      <p>Graduate of the Warsaw Medical Academy in 1998, PhD in medical sciences, specialist in general surgery
                    and oncological surgery. Long-standing researcher at the Warsaw Medical Academy (now the Medical
                    University of Warsaw), as well as the Medical Center for Postgraduate Education, and deputy head of the
                    Department of Oncological Surgery at the European Health Center. Academic lecturer. Currently a specialist
                    at the Department of Breast Cancer and Reconstructive Surgery at the National Research Institute of
                    Oncology in Warsaw.<br><br>Fellow of the Polish Society of Surgeons at the Department of Surgery of
                    the Medical University of Leuven in Belgium.<br><br>Member of the Polish Society of Oncological
                    Surgery.</p>
- id: Latala
  name: lek. Aleksandra Latała
  photo: imgs/zespol/Aleksandra-Latala.jpg
  specialty:
    pl: Medycyna estetyczna
    en: Aesthetic medicine
  role:
    pl: Specjalista medycyny estetycznej
    en: Specialist in aesthetic medicine
  bio:
    pl: |-
      <p>Nazywam się Aleksandra Latała i jestem absolwentką Warszawskiego Uniwersytetu Medycznego kierunku
                    lekarskiego oraz dyplomowanym lekarzem Medycyny Estetycznej. Stale poszerzam swoją wiedzę uczestnicząc w
                    konferencjach naukowych i szkoleniach. W mojej pracy priorytetem jest jakość i zdrowy wygląd skóry –
                    wierzę, że piękno zaczyna się od zdrowia. Z zaangażowaniem i precyzją tworzę indywidualne plany zabiegowe,
                    które pomagają moim pacjentom cieszyć się naturalnym i promiennym wyglądem.</p>
      <p>Prywatnie pasjonuję się radiologią, narciarstwem zjazdowym, tenisem ziemnym oraz sportami wodnymi.</p>
    en: |-
      <p>My name is Aleksandra Latala, and I am a graduate of the Medical University of Warsaw, Faculty of
                    Medicine, and a certified Aesthetic Medicine Physician. I continuously expand my knowledge by
                    participating in scientific conferences and training programs. In my work, my priority is skin quality
                    and a healthy appearance — I believe that beauty starts with health. With dedication and precision, I
                    create individualized treatment plans that help my patients enjoy a natural and radiant appearance.</p>
      <p>In my private life, I am passionate about radiology, downhill skiing, tennis, and water sports.</p>
- id: Krawczyk
  name: Mgr. Martyna Krawczyk
  photo: imgs/zespol/mgr-krawczyk.png
  specialty:
    pl: Kosmetologia
    en: Cosmetology
  role:
    pl: Magister kosmetologii
    en: Master of Cosmetology
  bio:
    pl: |-
      <p>Magister kosmetologii, absolwentka Wyższej Szkoły Zdrowia, Urody i Edukacji w Poznaniu. Specjalizuje się w
                    zabiegach igłowych oraz terapiach wykorzystujących zaawansowane technologie kosmetologiczne. Największą
                    satysfakcję przynosi jej prowadzenie kompleksowych terapii, opartych na świadomym łączeniu procedur
                    zabiegowych w celu osiągnięcia optymalnych efektów.</p>
      <p>W pracy skupia się na poprawie kondycji skóry, profilaktyce procesów starzenia oraz budowaniu
                    długotrwałych rezultatów. Każdego pacjenta traktuje indywidualnie, dobierając rozwiązania odpowiadające
                    potrzebom skóry i stylowi życia.</p>
      <p>Po godzinach najchętniej odpoczywa w ruchu – podczas wyjazdów, kajakowych wypraw i poznawania nowych
                    kulinarnych doświadczeń.</p>
    en: |-
      <p>Master of Cosmetology, graduate of the Higher School of Health, Beauty and Education in Poznań. She
                    specializes in needle treatments and therapies using advanced cosmetological technologies. She finds the
                    greatest satisfaction in conducting comprehensive therapies based on the conscious combination of
                    procedural treatments to achieve optimal results.</p>
      <p>In her work, she focuses on improving skin condition, preventing aging processes, and building long-lasting
                    results. She treats each patient individually, selecting solutions tailored to their skin needs and
                    lifestyle.</p>
      <p>In her free time, she prefers active rest — during trips, kayaking expeditions, and discovering new culinary
                    experiences.</p>
- id: Kukwa
  name: prof. dr hab. n. med. Andrzej Kukwa
  photo: imgs/zespol/Andrzej-Kukwa.png
  specialty:
    pl: Otolaryngologia
    en: Otolaryngology
  role:
    pl: Specjalista otolaryngologii
    en: Specialist in otolaryngology
  bio:
    pl: |-
      <p>Ukończył specjalizację I stopnia w&nbsp;zakresie laryngologii (1971&nbsp;r.) i&nbsp;II stopnia
                    w&nbsp;zakresie otolaryngologii (1974&nbsp;r.). Doktorat z&nbsp;anatomii uzyskał w&nbsp;1971&nbsp;r.,
                    habilitację w&nbsp;1974&nbsp;r. Sześć lat później został docentem, w&nbsp;1990&nbsp;r. profesorem
                    nadzwyczajnym, a&nbsp;w&nbsp;1998&nbsp;r. otrzymał tytuł profesora zwyczajnego. W&nbsp;latach 1989–2011
                    pracował na&nbsp;stanowisku kierownika Kliniki Otolaryngologicznej Akademii Medycznej w&nbsp;Warszawie.
                    W&nbsp;2011 roku został kierownikiem Katedry i&nbsp;Kliniki Otolaryngologicznej w&nbsp;Uniwersytecie
                    Warmińsko-Mazurskim w&nbsp;Olsztynie. Jest członkiem Europejskiego Towarzystwa Badań nad Snem
                    oraz&nbsp;Zarządu Polskiego Towarzystwa Badań nad Snem, Polskiego i&nbsp;Europejskiego Towarzystwa
                    Fizjologów Oddychania, a&nbsp;także Członkiem Honorowym Polskiego Towarzystwa Otolaryngologicznego
                    oraz&nbsp;współzałożycielem Polskiego Towarzystwa Chirurgii Podstawy Czaszki. Autor oraz&nbsp;współautor
                    ponad 250 publikacji naukowych oraz&nbsp;kilku rozwiązań patentowych.</p>
    en: |-
      <p>He completed first-degree specialization in laryngology (1971) and second-degree specialization in
                    otolaryngology (1974). He obtained his doctorate in anatomy in 1971 and habilitation in 1974. Six years
                    later he became an associate professor; in 1990 an extraordinary professor, and in 1998 he received the
                    title of full professor. From 1989 to 2011 he served as head of the Otolaryngology Clinic at the Medical
                    Academy in Warsaw. In 2011 he became head of the Department and Otolaryngology Clinic at the University of
                    Warmia and Mazury in Olsztyn. He is a member of the European Sleep Research Society and the Board of the
                    Polish Sleep Research Society, the Polish and European Society of Respiratory Physiologists, as well as an
                    Honorary Member of the Polish Otolaryngological Society and co-founder of the Polish Society of Skull Base
                    Surgery. Author and co-author of over 250 scientific publications and several patented solutions.</p>
