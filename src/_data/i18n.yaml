    offer:
      title: Treatments
      lead: Artisan Clinic is a modern plastic surgery and aesthetic medicine clinic in Warsaw. Our name is no coincidence — it derives from two words important to us&#58; art, and sanatio, meaning healing. Artisan is a name that reflects our sense of aesthetics, harmony, beauty, precision and respect for patient health.
      metaTitle: Treatments — plastic surgery and aesthetic medicine | Artisan Clinic Warsaw
    pricing:
      title: Pricing
      lead: The pricing at Artisan Clinic has been designed with transparency and our patients’ comfort in mind. We have carefully selected the range of services and their pricing to match the highest quality procedures and individual needs. We believe that access to professional medical and aesthetic care should be clear and understandable from the very first contact — that is why we value honesty, communication and transparency.
      metaTitle: Treatment prices | Artisan Clinic Warsaw
    team:
      title: Team
      lead: Plastic surgeons, oncological surgeons, aesthetic medicine specialists and cosmetologists — {team} specialists who guide each patient from consultation to recovery.
      metaTitle: Team — doctors and specialists | Artisan Clinic Warsaw
    consult:
      title: Free online consultation
      lead: "Take advantage of a free online consultation. Fill out the form from anywhere in Poland or abroad. Choose the procedure you are interested in (Deep Plane Facelift, upper eyelid correction, lower eyelid correction, ear correction, nose correction) and attach photos according to the guidelines.<br /><br />A surgeon will evaluate your submission for procedure eligibility and provide an estimated quote. This is the first step toward your transformation — with no obligations and without leaving your home!"
      metaTitle: Free online consultation | Artisan Clinic Warsaw
