      lead: Artisan Clinic to nowoczesna klinika chirurgii plastycznej i&nbsp;medycyny estetycznej w&nbsp;Warszawie. Nasza nazwa nie jest przypadkowa, pochodzi od dwóch ważnych dla nas słów — art, czyli sztuka i&nbsp;sanatio oznaczające uzdrowienie. Artisan to nazwa odzwierciedlająca nasze poczucie estetyki, harmonii, piękna, precyzji i&nbsp;szacunku dla zdrowia pacjenta.
      metaTitle: Zabiegi — chirurgia plastyczna i medycyna estetyczna | Artisan Clinic Warszawa
    pricing:
      title: Cennik
      lead: Cennik w&nbsp;Artisan Clinic został opracowany z&nbsp;myślą o&nbsp;przejrzystości i&nbsp;komforcie naszych pacjentów. Starannie dobraliśmy zakres usług i&nbsp;ich wyceny, aby odpowiadały najwyższej jakości zabiegom oraz indywidualnym potrzebom. Uważamy, że dostęp do profesjonalnej opieki medycznej i&nbsp;estetycznej powinien być jasny i&nbsp;zrozumiały już od pierwszego kontaktu — dlatego cenimy uczciwość, komunikację i&nbsp;transparentność.
      metaTitle: Cennik zabiegów | Artisan Clinic Warszawa
    team:
      title: Zespół
      lead: Chirurdzy plastyczni, chirurdzy onkologiczni, specjaliści medycyny estetycznej i&nbsp;kosmetolodzy — {team} specjalistów, którzy prowadzą pacjenta od konsultacji po rekonwalescencję.
      metaTitle: Zespół — lekarze i specjaliści | Artisan Clinic Warszawa
    consult:
      title: Bezpłatna konsultacja online
      lead: "Skorzystaj z&nbsp;bezpłatnej konsultacji online. Wypełnij formularz z&nbsp;dowolnego miejsca w&nbsp;Polsce lub za granicą. Wybierz interesujący cię zabieg (Deep Plane Facelift, korekcja powiek górnych, korekcja powiek dolnych, korekta uszu, korekcja nosa) i&nbsp;dołącz zdjęcia zgodne z&nbsp;wytycznymi.<br /><br />Chirurg oceni zgłoszenie pod kątem kwalifikacji do zabiegu i&nbsp;przedstawi orientacyjną wycenę. To pierwszy krok do Twojej metamorfozy – bez zobowiązań i&nbsp;bez wychodzenia z&nbsp;domu!"
      metaTitle: Bezpłatna konsultacja online | Artisan Clinic Warszawa
